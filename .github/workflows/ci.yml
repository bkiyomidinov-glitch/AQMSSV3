name: CI Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test:
    name: Lint & Pytest Suite
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Syntax check (py_compile)
        run: |
          python -m compileall backend tests main.py

      - name: Run test suite
        env:
          AQMSS_SECRET_KEY: test-ci-secret-key-32-chars-long!
          AQMSS_ADMIN_KEY: test-ci-admin-key
          FLASK_ENV: testing
        run: |
          pytest -v
